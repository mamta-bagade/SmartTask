spring.application.name=smarttask-backend
# Server Port 
server.port=8081

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smarttask_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT 
app.jwt.secret=${JWT_SECRET:SmartTaskSuperSecretKeyForJWTTokenGenerationMustBeLongEnough12345}
app.jwt.expiration=86400000